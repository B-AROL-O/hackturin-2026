<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Source Sans 3', 'DejaVu Sans', sans-serif">
  <title>The owner</title>
  <rect width="1920" height="1080" fill="#F7F4EC"/>
  <text x="140" y="300" font-size="34" font-weight="600" fill="#176B63" letter-spacing="4">THE OWNER</text>
  <text x="140" y="420" font-size="84" font-weight="600" fill="#172A2A">“Is my plant still producing</text>
  <text x="140" y="520" font-size="84" font-weight="600" fill="#172A2A">what it should?”</text>
  <rect x="140" y="600" width="120" height="8" fill="#E9AD35"/>
  <text x="140" y="700" font-size="42" fill="#4D605D">Installed years ago. Still running.</text>
  <text x="140" y="760" font-size="42" fill="#4D605D">Nobody can tell whether it underperforms.</text>
</svg>
