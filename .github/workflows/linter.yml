---
name: Lint

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        # v8.3.2 fixes push events without a commits array.
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JSON: false
          # Prettier is the canonical formatter; Biome's defaults conflict.
          VALIDATE_BIOME_FORMAT: false
          # The Remotion film project is generated, minified and vendored
          # (fonts, lock file, audio); it is checked by its own scripts.
          FILTER_REGEX_EXCLUDE: ^presentation/video/
          DEFAULT_BRANCH: main
# EOF
